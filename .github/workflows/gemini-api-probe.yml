name: Gemini API probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install latest google-genai
        run: python -m pip install --upgrade google-genai
      - name: List models and run minimal probes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time

          from google import genai
          from google.genai import types

          candidates = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
              "gemini-3-flash-preview",
              "gemini-2.5-flash",
              "gemini-2.5-flash-lite",
          ]

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          available = {}

          for model in client.models.list():
              name = model.name or ""
              actions = list(model.supported_actions or [])
              available[name.removeprefix("models/")] = actions
              print(json.dumps({
                  "event": "model",
                  "name": name,
                  "supported_actions": actions,
              }, ensure_ascii=False))

          for candidate in candidates:
              actions = available.get(candidate, [])
              present = candidate in available
              supported = "generateContent" in actions
              result = {
                  "event": "probe",
                  "model": candidate,
                  "present": present,
                  "supports_generateContent": supported,
                  "tested": False,
              }

              if present and supported:
                  result["tested"] = True
                  try:
                      response = client.models.generate_content(
                          model=candidate,
                          contents="Reply OK",
                          config=types.GenerateContentConfig(
                              temperature=0,
                              max_output_tokens=1,
                          ),
                      )
                      received = bool(getattr(response, "candidates", None))
                      result.update({
                          "sdk_status": "success",
                          "status_code": 200,
                          "success": received,
                          "response_received": response is not None,
                          "candidates_received": received,
                      })
                  except Exception as exc:
                      status = getattr(exc, "status_code", None) or getattr(exc, "code", None)
                      response = getattr(exc, "response", None)
                      if status is None and response is not None:
                          status = getattr(response, "status_code", None)
                      result.update({
                          "sdk_status": "error",
                          "success": False,
                          "error_type": type(exc).__name__,
                          "status_code": str(status) if status is not None else None,
                          "error_message": str(exc)[:500],
                      })
                  time.sleep(3)

              print(json.dumps(result, ensure_ascii=False))
          PY
